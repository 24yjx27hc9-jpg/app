name: flutter_notes
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  html: 0.15.6
  http: ^1.6.0
  flutter_html: ^3.0.0
  url_launcher: ^6.3.2
  photo_view: ^0.15.0
  cached_network_image: ^3.4.1
  sqflite: ^2.4.2
  path: ^1.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/images/contacts/max.png
    - assets/images/contacts/vk.png
  fonts:
    - family: 'Manrope'
      fonts:
        - asset: assets/text_fonts/Manrope-Bold.ttf
          weight: 700
    - family: 'Inter'
      fonts:
        - asset: assets/text_fonts/Inter_28pt-Regular.ttf
          weight: 400
        - asset: assets/text_fonts/Inter_28pt-Medium.ttf
          weight: 500
        - asset: assets/text_fonts/Inter_28pt-SemiBold.ttf
          weight: 600